name: photodrop

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-photodrop}
      POSTGRES_USER: ${POSTGRES_USER:-photodrop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-photodrop_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-photodrop}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-photodrop_dev_secret}
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-photodrop}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-photodrop_dev_secret}
      S3_BUCKET: ${S3_BUCKET:-photodrop-media}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${S3_BUCKET}"

  migrate:
    build:
      context: .
      target: migrate
    command: ["/app/bin/migrate"]
    environment: &backend-environment
      DATABASE_URL: ${DATABASE_URL:-postgres://photodrop:photodrop_dev@postgres:5432/photodrop?sslmode=disable}
      S3_ENDPOINT: ${S3_ENDPOINT:-minio:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-localhost:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-photodrop}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-photodrop_dev_secret}
      S3_BUCKET: ${S3_BUCKET:-photodrop-media}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      S3_PUBLIC_USE_SSL: ${S3_PUBLIC_USE_SSL:-false}
      S3_PRESIGN_TTL: ${S3_PRESIGN_TTL:-15m}
      HTTP_ADDR: ${HTTP_ADDR:-:8080}
      CLEANUP_INTERVAL: ${CLEANUP_INTERVAL:-1m}
      THUMBNAIL_INTERVAL: ${THUMBNAIL_INTERVAL:-2s}
      ARCHIVE_INTERVAL: ${ARCHIVE_INTERVAL:-2s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
      AUTH_ACCESS_SECRET: ${AUTH_ACCESS_SECRET:-local_development_secret_change_me_32_chars}
      AUTH_ACCESS_TTL: ${AUTH_ACCESS_TTL:-15m}
      AUTH_REFRESH_TTL: ${AUTH_REFRESH_TTL:-720h}
      AUTH_ISSUER: ${AUTH_ISSUER:-photodrop}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-zhyvoappbot}
      TELEGRAM_LOGIN_CLIENT_ID: ${TELEGRAM_LOGIN_CLIENT_ID:-}
      TELEGRAM_LOGIN_CLIENT_SECRET: ${TELEGRAM_LOGIN_CLIENT_SECRET:-}
      TELEGRAM_INIT_DATA_TTL: ${TELEGRAM_INIT_DATA_TTL:-10m}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: api
    environment: *backend-environment
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Isolated preview tunnel. It has its own Tailscale identity and does not
  # share state, routes, or configuration with Tailscale installed on Windows.
  tailscale-preview:
    image: tailscale/tailscale:v1.98.10
    hostname: zhyvo-preview
    environment:
      TS_AUTHKEY: ${TAILSCALE_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: zhyvo-preview
    volumes:
      - tailscale_preview_state:/var/lib/tailscale
    profiles: ["preview"]
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  tailscale_preview_state:
